<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet — Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;450;500;600;700&family=Archivo+Expanded:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <main class="sheet">
      <header class="masthead">
        <span class="wordmark">Sheet</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">☾</button>
      </header>
      <p id="status-line" class="status-line">Cargando…</p>

      <form id="capture-form" class="capture-bar" autocomplete="off">
        <input
          id="capture-input"
          class="capture-input"
          type="text"
          placeholder="Add a task"
          maxlength="200"
          required
        />
        <button type="submit" class="add-btn">ADD</button>
      </form>

      <div class="control-row">
        <div class="filters" role="tablist">
          <button class="filter-tab is-active" data-filter="all" type="button">All</button>
          <button class="filter-tab" data-filter="open" type="button">Open</button>
          <button class="filter-tab" data-filter="done" type="button">Done</button>
        </div>
        <select id="sort-select" class="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="az">A–Z</option>
        </select>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title">Nothing on the sheet yet.</p>
        <p class="empty-sub">Type your first task above.</p>
      </div>

      <div id="error-state" class="error-state" hidden>
        <p>Couldn't reach the server. Check that it's running on port 3000.</p>
        <button id="retry-btn" class="retry-btn" type="button">Try again</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
